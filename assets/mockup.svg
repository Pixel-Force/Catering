      <text x="16" y="78" font-family="sans-serif" font-size="10" font-weight="bold" fill="#702D3A">STEP 3 OF 6: MENU PREFERENCES</text>
      <rect x="16" y="86" width="208" height="4" rx="2" fill="#E3D5C5" />
      <rect x="16" y="86" width="104" height="4" rx="2" fill="#702D3A" />

      <!-- Step Content Area -->
      <text x="16" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">Select Catering Tier</text>

      <!-- Option 1 -->
      <g transform="translate(16, 130)">
        <rect x="0" y="0" width="208" height="62" rx="10" fill="#FFF" stroke="#702D3A" stroke-width="1.8" />
        <circle cx="18" cy="31" r="6" fill="#702D3A" />
        <circle cx="18" cy="31" r="2.5" fill="#FFF" />
        <text x="32" y="27" font-family="sans-serif" font-size="10" font-weight="bold" fill="#702D3A">Standard Catering Tier</text>
        <text x="32" y="44" font-family="sans-serif" font-size="8.5" fill="#777">$45/guest &#x2022; 3 Courses + Buffet Setup</text>
        <text x="192" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#702D3A" text-anchor="end">&#x2605;</text>
      </g>

      <!-- Option 2 -->
      <g transform="translate(16, 200)">
        <rect x="0" y="0" width="208" height="62" rx="10" fill="#FAFAFA" stroke="#E5E5E5" />
        <circle cx="18" cy="31" r="6" fill="#FFF" stroke="#CCC" />
        <text x="32" y="27" font-family="sans-serif" font-size="10" font-weight="bold" fill="#333">Premium Luxury Tier</text>
        <text x="32" y="44" font-family="sans-serif" font-size="8.5" fill="#777">$68/guest &#x2022; 5 Courses + Wine Pairing</text>
      </g>

      <!-- Dietary Badges Checkboxes -->
      <text x="16" y="286" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222">Dietary Requirements</text>
      <g transform="translate(16, 298)">
        <rect x="0" y="0" width="64" height="22" rx="11" fill="#EBF5EC" />
        <text x="32" y="15" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#1B6428" text-anchor="middle">&#x2713; Halal</text>

        <rect x="70" y="0" width="72" height="22" rx="11" fill="#EBF5EC" />
        <text x="106" y="15" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#1B6428" text-anchor="middle">&#x2713; Vegan</text>

        <rect x="148" y="0" width="60" height="22" rx="11" fill="#EBF5EC" />
        <text x="178" y="15" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#1B6428" text-anchor="middle">&#x2713; GF</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(16, 338)">
        <rect x="0" y="0" width="208" height="38" rx="19" fill="#702D3A" />
        <text x="104" y="23" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#FFF" text-anchor="middle">Continue to Step 4 &#x2192;</text>
      </g>

      <!-- Live Reference Callout -->
      <g transform="translate(16, 392)">
        <rect x="0" y="0" width="208" height="74" rx="10" fill="#FFF9F2" stroke="#EAD8C3" />
        <text x="12" y="22" font-family="sans-serif" font-size="9" font-weight="bold" fill="#9C6219">&#x26A1; Instant Reference Tracking</text>
        <text x="12" y="38" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#702D3A">Ref: CAT-2026-1041</text>
        <text x="12" y="54" font-family="sans-serif" font-size="8" fill="#666">Track &amp; approve quotes online anytime.</text>
      </g>
    </g>

    <!-- Bottom Home Indicator -->
    <rect x="95" y="505" width="70" height="4" rx="2" fill="#5A5A6A" />
  </g>

  <!-- BOTTOM CAPABILITIES BAR -->
  <g transform="translate(70, 675)">
    <rect x="0" y="0" width="1140" height="96" rx="18" fill="#200B10" stroke="#4F1F27" stroke-width="1.2" />

    <!-- Feature 1 -->
    <g transform="translate(30, 26)">
      <circle cx="22" cy="22" r="20" fill="#702D3A" />
      <text x="22" y="28" font-family="sans-serif" font-size="15" text-anchor="middle">&#x1F37D;&#xFE0F;</text>
      <text x="54" y="19" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#FFF8EF">10 Menu Categories</text>
      <text x="54" y="36" font-family="sans-serif" font-size="11" fill="#D4AF37">Starters to Desserts + Live Search</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(330, 26)">
      <circle cx="22" cy="22" r="20" fill="#702D3A" />
      <text x="22" y="28" font-family="sans-serif" font-size="15" text-anchor="middle">&#x1F4CB;</text>
      <text x="54" y="19" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#FFF8EF">6-Step Quote Engine</text>
      <text x="54" y="36" font-family="sans-serif" font-size="11" fill="#D4AF37">Live Estimates &amp; Reference Codes</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(620, 26)">
      <circle cx="22" cy="22" r="20" fill="#702D3A" />
      <text x="22" y="28" font-family="sans-serif" font-size="15" text-anchor="middle">&#x1F4B3;</text>
      <text x="54" y="19" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#FFF8EF">Customer Portal</text>
      <text x="54" y="36" font-family="sans-serif" font-size="11" fill="#D4AF37">Review &amp; Approve Quotes Online</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(900, 26)">
      <circle cx="22" cy="22" r="20" fill="#702D3A" />
      <text x="22" y="28" font-family="sans-serif" font-size="15" text-anchor="middle">&#x2699;&#xFE0F;</text>
      <text x="54" y="19" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#FFF8EF">Admin CMS &amp; CRM</text>
      <text x="54" y="36" font-family="sans-serif" font-size="11" fill="#D4AF37">Manage Menus, Quotes &amp; Analytics</text>
    </g>
