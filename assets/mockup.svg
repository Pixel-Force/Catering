<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220D12" />
      <stop offset="50%" stop-color="#3D1720" />
      <stop offset="100%" stop-color="#14070A" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7A1E" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="desktopScreen">
      <rect x="0" y="0" width="750" height="470" rx="8" />
    </clipPath>
    <clipPath id="mobileScreen">
      <rect x="0" y="0" width="240" height="490" rx="28" />
    </clipPath>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="820" fill="url(#bgGradient)" />
  <circle cx="220" cy="180" r="280" fill="#702D3A" opacity="0.3" filter="url(#softGlow)" />
  <circle cx="1060" cy="620" r="300" fill="#C69A5B" opacity="0.18" filter="url(#softGlow)" />

  <!-- Header Branding Area -->
  <g transform="translate(70, 40)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#702D3A" stroke="#D4AF37" stroke-width="1.5" />
    <text x="24" y="32" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#FFF8EF" text-anchor="middle">G</text>
    <text x="64" y="25" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="bold" fill="#FFF8EF">Grand Heritage Catering &amp; Events</text>
    <text x="64" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#D4AF37" letter-spacing="2">LUXURY CATERING PLATFORM &amp; BOOKING ENGINE</text>

    <!-- Badges -->
    <g transform="translate(720, 8)">
      <rect x="0" y="0" width="110" height="30" rx="15" fill="#702D3A" stroke="#8E3B4C" />
      <text x="55" y="19" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFF8EF" text-anchor="middle">&#x2B50; 5-Star Rated</text>
    </g>
    <g transform="translate(845, 8)">
      <rect x="0" y="0" width="135" height="30" rx="15" fill="#FFF8EF" opacity="0.12" />
      <text x="67" y="19" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3E5AB" text-anchor="middle">&#x1F3C6; Award-Winning</text>
    </g>
    <g transform="translate(995, 8)">
      <rect x="0" y="0" width="145" height="30" rx="15" fill="url(#goldAccent)" />
      <text x="72" y="19" font-family="sans-serif" font-size="11" font-weight="bold" fill="#220D12" text-anchor="middle">PRODUCTION READY</text>
    </g>
  </g>

  <!-- DESKTOP MOCKUP (LEFT) -->
  <g transform="translate(70, 115)" filter="url(#dropShadow)">
    <!-- Outer Laptop Bezel -->
    <rect x="0" y="0" width="770" height="490" rx="16" fill="#1C1C22" stroke="#363642" stroke-width="2" />
    <circle cx="385" cy="10" r="3.5" fill="#4B4B5C" />

    <!-- Laptop Display Window -->
    <g transform="translate(10, 20)" clip-path="url(#desktopScreen)">
      <!-- Browser Top Bar -->
      <rect x="0" y="0" width="750" height="34" fill="#282830" />
      <circle cx="20" cy="17" r="4.5" fill="#FF5F56" />
      <circle cx="36" cy="17" r="4.5" fill="#FFBD2E" />
      <circle cx="52" cy="17" r="4.5" fill="#27C93F" />
      <rect x="180" y="7" width="390" height="20" rx="6" fill="#19191E" />
      <text x="375" y="21" font-family="sans-serif" font-size="10.5" fill="#9999AB" text-anchor="middle">https://penta-websites.github.io/Catering/</text>

      <!-- Website Content Canvas -->
      <rect x="0" y="34" width="750" height="436" fill="#FFF8EF" />

      <!-- Navbar -->
      <rect x="0" y="34" width="750" height="46" fill="#FFFFFF" />
      <line x1="0" y1="80" x2="750" y2="80" stroke="#EFE5D8" stroke-width="1" />
      <text x="30" y="63" font-family="'Playfair Display', serif" font-size="15" font-weight="bold" fill="#702D3A">Grand Heritage</text>
      <text x="220" y="62" font-family="sans-serif" font-size="10" font-weight="600" fill="#702D3A">Home</text>
      <text x="265" y="62" font-family="sans-serif" font-size="10" fill="#666">About</text>
      <text x="310" y="62" font-family="sans-serif" font-size="10" fill="#666">Services</text>
      <text x="365" y="62" font-family="sans-serif" font-size="10" fill="#666">Menu</text>
      <text x="410" y="62" font-family="sans-serif" font-size="10" fill="#666">Packages</text>
      <text x="470" y="62" font-family="sans-serif" font-size="10" fill="#666">Gallery</text>
      <text x="525" y="62" font-family="sans-serif" font-size="10" fill="#666">Contact</text>
      <rect x="620" y="43" width="100" height="28" rx="14" fill="#702D3A" />
      <text x="670" y="61" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFF" text-anchor="middle">Get a Quote</text>

      <!-- Hero Banner -->
      <rect x="0" y="80" width="750" height="250" fill="#2E1218" />
      <circle cx="560" cy="200" r="170" fill="#702D3A" opacity="0.65" />
      <text x="40" y="132" font-family="sans-serif" font-size="10" font-weight="bold" fill="#D4AF37" letter-spacing="1.5">FINE DINING &amp; ARTISAN CATERING</text>
      <text x="40" y="168" font-family="'Playfair Display', serif" font-size="26" font-weight="bold" fill="#FFFFFF">Exceptional Catering for</text>
      <text x="40" y="200" font-family="'Playfair Display', serif" font-size="26" font-weight="bold" fill="#D4AF37">Every Special Occasion</text>
      <text x="40" y="230" font-family="sans-serif" font-size="11" fill="#E8D5BF">Chef-crafted banquets, farm-fresh ingredients, and bespoke event design.</text>

      <rect x="40" y="252" width="120" height="34" rx="17" fill="#D4AF37" />
      <text x="100" y="273" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#220D12" text-anchor="middle">Request a Quote</text>

      <rect x="175" y="252" width="120" height="34" rx="17" fill="none" stroke="#FFF" stroke-width="1.5" />
      <text x="235" y="273" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#FFF" text-anchor="middle">Explore Menu</text>

      <!-- Hero Food Presentation Card -->
      <g transform="translate(465, 115)">
        <rect x="0" y="0" width="250" height="155" rx="16" fill="#3D1720" stroke="#D4AF37" stroke-width="1.5" />
        <rect x="14" y="14" width="222" height="85" rx="10" fill="#54212D" />
        <text x="125" y="60" font-family="'Playfair Display', serif" font-size="13" fill="#F3E5AB" text-anchor="middle">&#x2728; Plated Gourmet Cuisine</text>
        <text x="20" y="118" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFF">Truffle Beef &amp; Sea Bass</text>
        <text x="20" y="135" font-family="sans-serif" font-size="9.5" fill="#D4AF37">$68.00 / guest &#x2022; 4 Courses Included</text>
      </g>

      <!-- 3 Service Columns -->
      <g transform="translate(40, 345)">
        <!-- Card 1 -->
        <rect x="0" y="0" width="210" height="110" rx="12" fill="#FFFFFF" stroke="#E9DEC9" />
        <rect x="16" y="16" width="30" height="30" rx="8" fill="#FFF0DF" />
        <text x="31" y="36" font-family="sans-serif" font-size="15" text-anchor="middle">&#x1F48D;</text>
        <text x="56" y="34" font-family="sans-serif" font-size="12" font-weight="bold" fill="#702D3A">Wedding Banquets</text>
        <text x="16" y="64" font-family="sans-serif" font-size="9.5" fill="#666">Full bridal tastings, seated service,</text>
        <text x="16" y="78" font-family="sans-serif" font-size="9.5" fill="#666">and signature midnight tables.</text>

        <!-- Card 2 -->
        <rect x="230" y="0" width="210" height="110" rx="12" fill="#FFFFFF" stroke="#E9DEC9" />
        <rect x="246" y="16" width="30" height="30" rx="8" fill="#FFF0DF" />
        <text x="261" y="36" font-family="sans-serif" font-size="15" text-anchor="middle">&#x1F4BC;</text>
        <text x="286" y="34" font-family="sans-serif" font-size="12" font-weight="bold" fill="#702D3A">Corporate Galas</text>
        <text x="246" y="64" font-family="sans-serif" font-size="9.5" fill="#666">Punctual boxed artisan luncheons</text>
        <text x="246" y="78" font-family="sans-serif" font-size="9.5" fill="#666">and VIP cocktail receptions.</text>

        <!-- Card 3 -->
        <rect x="460" y="0" width="210" height="110" rx="12" fill="#FFFFFF" stroke="#E9DEC9" />
        <rect x="476" y="16" width="30" height="30" rx="8" fill="#FFF0DF" />
        <text x="491" y="36" font-family="sans-serif" font-size="15" text-anchor="middle">&#x2728;</text>
        <text x="516" y="34" font-family="sans-serif" font-size="12" font-weight="bold" fill="#702D3A">Bespoke Menus</text>
        <text x="476" y="64" font-family="sans-serif" font-size="9.5" fill="#666">10 culinary categories with 100%</text>
        <text x="476" y="78" font-family="sans-serif" font-size="9.5" fill="#666">customizable dietary options.</text>
      </g>
    </g>

    <!-- Laptop Base Stand -->
    <path d="M-35 490 L805 490 L765 506 L5 506 Z" fill="#282830" />
    <rect x="335" y="490" width="100" height="6" rx="2" fill="#4B4B5C" />
  </g>

