<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Grand Heritage Catering CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-stone-900 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 shadow-2xl border border-stone-200">
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-full bg-[#702D3A] text-amber-300 font-serif font-bold text-2xl flex items-center justify-center mx-auto mb-3 shadow-md">
        H
      </div>
      <h2 class="text-2xl font-serif font-bold text-gray-900">Admin Portal Login</h2>
      <p class="text-xs text-stone-500 mt-1">Grand Heritage Catering Content & Booking CMS</p>
    </div>

    <!-- Error Alert -->
    <div id="login-error" class="hidden p-3 bg-red-50 text-red-700 text-xs font-semibold rounded-xl border border-red-200 mb-5"></div>

    <form id="admin-login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1.5">Username or Email</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-xs"></i>
          <input type="text" id="login-username" required value="admin" class="w-full pl-9 pr-3 py-2.5 bg-stone-50 border border-stone-300 rounded-xl text-xs text-gray-900 focus:outline-none focus:border-[#702D3A]">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1.5">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-xs"></i>
          <input type="password" id="login-password" required value="admin123" class="w-full pl-9 pr-3 py-2.5 bg-stone-50 border border-stone-300 rounded-xl text-xs text-gray-900 focus:outline-none focus:border-[#702D3A]">
        </div>
      </div>

      <button type="submit" id="login-btn" class="w-full py-3 bg-[#702D3A] hover:bg-[#531F2A] text-white rounded-xl text-xs font-bold transition-all shadow-md mt-2 flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
      </button>
    </form>

    <!-- Default Credentials Helper Card -->
    <div class="mt-8 p-4 bg-amber-50 rounded-2xl border border-amber-200 text-center">
      <span class="text-[10px] uppercase font-bold text-amber-800 tracking-wider block mb-1">Pre-configured Admin Access:</span>
      <div class="text-xs font-mono text-gray-800">User: <strong class="text-burgundy">admin</strong> | Pass: <strong class="text-burgundy">admin123</strong></div>
    </div>

    <div class="mt-6 text-center">
      <a href="../index.html" class="text-xs text-stone-400 hover:text-stone-700 font-medium">← Back to Public Website</a>
    </div>
  </div>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const errorBox = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      errorBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Authenticating...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success && data.token) {
          localStorage.setItem('heritage_admin_token', data.token);
          window.location.href = 'index.html';
        } else {
          errorBox.textContent = data.error || 'Invalid username or password.';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        // Offline demo mode bypass
        if (username === 'admin' && password === 'admin123') {
          localStorage.setItem('heritage_admin_token', 'demo_jwt_token_2026');
          window.location.href = 'index.html';
        } else {
          errorBox.textContent = 'Invalid username or password (use admin / admin123).';
          errorBox.classList.remove('hidden');
        }
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
